name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt types-requests

      - name: Run deterministic stress checks
        run: make PYTHON=python test

      - name: Lint with ruff
        run: make PYTHON=python lint

      - name: Type check with mypy
        run: make PYTHON=python typecheck

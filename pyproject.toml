[project]
name = "standalone-orchestrator-v2"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
typesafe = ["typesafe-sdk==0.7.0"]

[tool.setuptools]
packages = ["orchestrator_v2"]

[project.scripts]
orchestrator-v2 = "orchestrator_v2.cli:main"
